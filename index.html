<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sushi Stack 2048</title>
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/tier-0.css" />
    <link rel="stylesheet" href="css/tier-1.css" />
    <link rel="stylesheet" href="css/tier-2.css" />
    <link rel="stylesheet" href="css/tier-3.css" />
    <link rel="stylesheet" href="css/tier-4.css" />
    <link rel="stylesheet" href="css/tier-5.css" />
    <link rel="stylesheet" href="css/tier-6.css" />
  </head>
  <body>
    <main class="shell">
      <header class="mast">
        <div>
          <h1>Sushi Stack</h1>
          <p class="tag">2048 with sushi</p>
        </div>
        <div class="scores">
          <div class="scorebox">
            <span class="label">Score</span>
            <span id="score">0</span>
            <span id="score-flash"></span>
          </div>
          <div class="scorebox">
            <span class="label">Best</span>
            <span id="best">0</span>
          </div>
        </div>
      </header>

      <div class="well">
        <div class="board-wrap">
          <div id="board" role="grid" aria-label="Sushi 2048 board"></div>
          <div id="overlay" hidden>
            <p>No more moves</p>
            <button type="button" id="overlay-new">New game</button>
          </div>
        </div>
      </div>

      <footer class="footer">
        <p id="hint">Swipe or arrows to merge sushi.</p>
        <button type="button" id="new-game">New game</button>
      </footer>
    </main>
    <script src="js/logic.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
